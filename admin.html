<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ES 後台</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#f6f6f5;--card:#fff;--ink:#17181a;--gray:#6b6f76;--line:#d9dbdf;--wine:#6b1a2a;--wine-l:#f5eced;--ok:#2d6a4f;--warn:#9a6700;--err:#b42318;
--serif:'Cormorant Garamond','Noto Serif TC',serif;--sans:'Noto Sans TC',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}body{font:13px/1.6 var(--sans);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);padding:32px;width:min(360px,100%);display:grid;gap:12px}
.logo{font:500 22px var(--serif);letter-spacing:.2em}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;padding:9px 10px;font:inherit;color:inherit;border-radius:2px}
textarea{min-height:90px;resize:vertical}label{font-size:11px;color:var(--gray);letter-spacing:.05em;display:block;margin-bottom:3px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 16px;border-radius:2px}.btn.ghost{background:none;color:var(--ink)}
.btn.wine{background:var(--wine);border-color:var(--wine)}.btn.sm{padding:4px 10px;font-size:12px}.btn.danger{background:none;color:var(--err);border-color:var(--err)}
.err{color:var(--err);font-size:12px;min-height:16px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}nav button{border:0;background:none;padding:6px 12px;color:var(--gray);border-bottom:2px solid transparent}
nav button.on{color:var(--wine);border-color:var(--wine);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
h2{font:500 22px var(--serif);margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--gray);font-weight:500}
.scroll{overflow-x:auto}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--wine-l);color:var(--wine)}
.tag.ok{background:#e6f4ec;color:var(--ok)}.tag.warn{background:#fff4d6;color:var(--warn)}.tag.err{background:#fde8e6;color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.pcard img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#ddd;display:block}
.pcard{border:1px solid var(--line);background:#fff;padding:8px;font-size:12px;display:grid;gap:4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:110px;height:146px;object-fit:cover;border:1px solid var(--line);display:block}.thumbs [data-mkcut]{background:var(--wine);color:#fff;border-color:var(--wine)}
.thumbs b{position:absolute;top:0;right:0;background:#000a;color:#fff;width:18px;height:18px;text-align:center;cursor:pointer;line-height:18px}
.sq-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line,#ddd);box-shadow:0 10px 30px -12px rgb(0 0 0/.3);max-height:260px;overflow:auto}.sq-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line,#eee)}.sq-list button:hover{background:#f6f1f1}.sq-list button b{color:var(--wine);margin-right:6px}.sq-list button span{float:right;color:#777}
.note{background:var(--wine-l);color:var(--wine);padding:8px 12px;font-size:12px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}#toast.on{opacity:1}
dialog{border:1px solid var(--line);padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#0006}
td input{padding:5px 6px}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.steps button{flex:1;min-width:110px;border:1px solid var(--line);background:#fff;padding:9px;text-align:left}.steps button b{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--line);text-align:center;margin-right:6px;font-size:11px;line-height:20px}.steps button.on{border-color:var(--wine);color:var(--wine)}.steps button.on b{background:var(--wine);color:#fff}
.studio{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:820px){.studio{grid-template-columns:1fr}}.pvbox{position:sticky;top:70px}
h3{font:500 18px var(--serif);margin-bottom:10px}.checker{background:repeating-conic-gradient(#e9e9e9 0 25%,#fff 0 50%) 0 0/14px 14px;display:inline-block}
.thumbs div{position:relative}.swatch{width:34px;height:34px;border:2px solid var(--line);border-radius:50%}.swatch.on{border-color:var(--wine)}
.postimg{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden}.postimg img{position:absolute;bottom:var(--y,0%);left:calc(50% + var(--x,0%));transform:translateX(-50%);height:var(--s,86%);max-width:95%;object-fit:contain;cursor:grab;user-select:none;touch-action:none}.postimg img:active{cursor:grabbing}.postimg .wm{position:absolute;left:0;right:0;top:34%;text-align:center;font:300 min(20vw,92px) var(--serif)}
.pcprev{display:grid;gap:4px;max-width:260px;margin:auto}.pcprev .phto{background:#d9dadf;aspect-ratio:3/4;display:grid;place-items:center}.pcprev img{max-width:100%;max-height:100%;object-fit:contain}
.fb,.ig,.th{background:#fff;border:1px solid var(--line);font-size:13px;max-width:380px;margin:auto}.hd{display:flex;gap:8px;align-items:center;padding:8px}.hd i,.th>i{width:32px;height:32px;border-radius:50%;background:var(--wine);display:inline-block;flex:none}.hd small{display:block;color:var(--gray)}
.fb .tx,.ig .tx{padding:8px;white-space:pre-wrap}.fb .ft,.ig .ic{padding:8px;color:var(--gray)}.th{display:flex;gap:10px;padding:10px}.th>div{flex:1;min-width:0}.th .tx{white-space:pre-wrap;margin:4px 0}.th .timg{border-radius:10px;overflow:hidden;margin:6px 0}.th .ic{color:var(--gray)}

#errlog{position:fixed;right:14px;bottom:14px;z-index:9000;font-size:12px}#errlog[hidden]{display:none}#errlog>button{background:#7a1f2b;color:#fff;border:0;padding:8px 12px;cursor:pointer;box-shadow:0 6px 20px -8px rgb(0 0 0/.5)}
#errlog .el_box{display:none;position:absolute;right:0;bottom:40px;width:min(520px,calc(100vw - 28px));max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgb(0 0 0/.4)}#errlog.open .el_box{display:block}
#errlog .el_hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}#errlog .el_hd button{margin-left:6px;font-size:11px;padding:3px 8px;border:1px solid var(--line);background:#fff;cursor:pointer}
#errlog .el_it{padding:8px 10px;border-bottom:1px solid var(--line)}#errlog .el_it small{color:#888}#errlog .el_it pre{margin:4px 0 0;font-size:11px;white-space:pre-wrap;color:#666;max-height:120px;overflow:auto}
</style></head><body>
<div class="login" id="login"><form id="lf"><div class="logo">ENDLESS STORIES</div><div style="color:var(--gray)">管理後台</div>
<div><label>Email</label><input type="email" id="le" autocomplete="username" required></div>
<div><label>密碼</label><input type="password" id="lp" autocomplete="current-password" required></div>
<div class="err" id="lerr"></div><button class="btn wine">登入</button></form></div>
<div id="app" class="hidden">
<header><div class="logo" style="font-size:16px">ES 後台</div>
<nav id="nav"></nav><span id="who" style="color:var(--gray)"></span><button class="btn ghost sm" id="out">登出</button></header>
<main id="view"></main></div><div id="toast"></div>
<script src="config.js"></script><script src="sb.js"></script><script src="api.js"></script><script src="admin.js"></script><script src="studio.js"></script>
</body></html>
